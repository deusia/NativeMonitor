name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS arm64 构建与测试
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 记录运行环境
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: 检查脚本与版本
        run: |
          bash -n build.sh scripts/package-release.sh
          python3 scripts/check-version.py --self-test
          python3 scripts/check-version.py
      # 菜单栏定位测试需要系统菜单栏服务，不能仅启动 XCTest 进程。
      - name: 准备桌面会话
        run: |
          open -a Finder
          open -a SystemUIServer
      - name: 运行测试
        run: xcodebuild -project NativeMonitor.xcodeproj -scheme NativeMonitor -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode test
      - name: 构建发布包
        run: ./scripts/package-release.sh
      - name: 保存构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NativeMonitor-macos-arm64
          path: .build/release-artifacts/
          if-no-files-found: error
          retention-days: 7
